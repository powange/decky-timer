name: Release

# On every push to main, builds the plugin and publishes a GitHub release
# tagged v<version from package.json> if that release doesn't exist yet.
# Bump "version" in package.json to publish a new release.
#
# The zip is always named decky-timer-overlay.zip, so this URL always points to
# the latest version (Decky > Developer > Install plugin from URL):
#   https://github.com/powange/decky-timer-overlay/releases/latest/download/decky-timer-overlay.zip
# Once installed, the plugin's own "Mises à jour" button handles updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(jq -r .version package.json)"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.version.outputs.exists == 'false'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Check Python
        if: steps.version.outputs.exists == 'false'
        run: python3 -m py_compile main.py overlay/overlay.py

      - name: Build frontend
        if: steps.version.outputs.exists == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Package
        if: steps.version.outputs.exists == 'false'
        run: |
          pnpm run package
          cd target && zip -r ../decky-timer-overlay.zip decky-timer-overlay

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          files: decky-timer-overlay.zip
          generate_release_notes: true
          make_latest: true
